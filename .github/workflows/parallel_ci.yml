name: Parallel CI
on:
  workflow_call:
    inputs:
      fail-fast:
        description: "Stop all jobs if any job fails"
        required: false
        type: boolean
        default: true

jobs:
  parallel-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        # set N-1 indexes for parallel jobs
        # When you run 2 parallel jobs then first job will have index 0, the second job will have index 1 etc
        ci_node_index: [0, 1, 2, 3, 4, 5, 6, 7]
        # Set N number of parallel jobs you want to run
        # Remember to update ci_node_index above to 0..N-1
        # Groups are balanced by recorded runtime (spec/parallel_runtime_rspec.log).
        # The slowest single spec file sets a floor on group time, so more jobs
        # than this mostly adds setup cost without finishing sooner.
        ci_node_total: [8]

    services:
      memcached:
        image: memcached:1.6.22
        ports:
          - 11211
      mysql:
        image: mysql:8.4.7
        env:
          MYSQL_DATABASE: datacite
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306
      elasticsearch:
        image: opensearchproject/opensearch:2
        env:
          discovery.type: single-node
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: AnUnsecurePassword123
          DISABLE_SECURITY_PLUGIN: true
          http.cors.enabled: true
          bootstrap.memory_lock: true
          http.cors.allow-origin: "*"
          compatibility.override_main_response_version: true
          logger.org.opensearch.discovery: "ERROR"
        ports:
          - 9200
      floci:
        # Lightweight LocalStack-compatible AWS emulator for S3 metadata storage.
        # Signatures aren't validated, so the dummy S3 credentials below work as-is.
        image: floci/floci:2.3.0
        ports:
          - "4566:4566"

    env:
      MYSQL_HOST: "127.0.0.1"
      MYSQL_USER: root
    steps:
      - uses: actions/checkout@v7

      - name: Sync time
        run: |
          sudo apt-get update
          sudo apt-get install -y ntpsec-ntpdate
          sudo ntpdate pool.ntp.org

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.9
      - uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-ruby-4.0.9-libmysqlclient24-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ruby-4.0.9-libmysqlclient24-gems-
      - name: Install ImageMagick and MySQL client
        # The Ubuntu mirror sometimes stalls for minutes. Give up on a slow
        # attempt after 60s and retry; a fresh attempt usually gets through.
        timeout-minutes: 4
        run: |
          for attempt in 1 2 3; do
            # Recommended extras (Ghostscript, fonts) aren't needed and roughly
            # double the download; dead connections are dropped after 10s, both
            # while updating the package index and while downloading packages.
            if sudo timeout 60 sh -c 'o="-o Acquire::http::Timeout=10"; apt-get $o update && apt-get $o install -y --no-install-recommends imagemagick libmysqlclient-dev'; then
              exit 0
            fi
            echo "::warning::apt install attempt $attempt timed out or failed; retrying"
            sudo dpkg --configure -a || true  # tidy up if an attempt was killed mid-install
          done
          exit 1
      - name: Install
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          MYSQL_DATABASE: ${{ job.services.mysql.env.MYSQL_DATABASE }}
          ES_HOST: localhost:${{ job.services.elasticsearch.ports[9200] }}
          ELASTIC_PASSWORD: ${{ job.services.elasticsearch.env.OPENSEARCH_INITIAL_ADMIN_PASSWORD }}
          MEMCACHE_SERVERS: localhost:${{ job.services.memcached.ports[11211] }}
          RAILS_ENV: test
        run: |
          cp .env.build .env
          gem install rubygems-update -v 3.4.22
          gem install bundler:2.6.9
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3
          bundle exec rails db:setup
      - name: Test
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          MYSQL_DATABASE: ${{ job.services.mysql.env.MYSQL_DATABASE }}
          ES_HOST: localhost:${{ job.services.elasticsearch.ports[9200] }}
          ELASTIC_PASSWORD: ${{ job.services.elasticsearch.env.OPENSEARCH_INITIAL_ADMIN_PASSWORD }}
          MEMCACHE_SERVERS: localhost:${{ job.services.memcached.ports[11211] }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ENDPOINT_URL_S3: http://localhost:${{ job.services.floci.ports[4566] }}
          AWS_ACCESS_KEY_ID_S3: s3accesskeyid
          AWS_SECRET_ACCESS_KEY_S3: s3accesskeypass
          METADATA_STORAGE_BUCKET_NAME: metadata
          CI_NODE_TOTAL: ${{ matrix.ci_node_total }}
          CI_NODE_INDEX: ${{ matrix.ci_node_index }}
          RAILS_ENV: test
        run: |
          # Record this group's per-file runtimes so the committed log can be refreshed
          RSPEC_OPTS="--format progress --format ParallelTests::RSpec::RuntimeLogger --out tmp/parallel_runtime_rspec.log"
          if [ "${{ inputs.fail-fast }}" = "true" ]; then
            RSPEC_OPTS="$RSPEC_OPTS --fail-fast"
          fi
          bundle exec parallel_test spec/ -n $CI_NODE_TOTAL --only-group $CI_NODE_INDEX --type rspec \
            --group-by runtime --runtime-log spec/parallel_runtime_rspec.log -o "$RSPEC_OPTS"
          echo $?
      # To refresh spec/parallel_runtime_rspec.log from a green run:
      #   gh run download <run-id> -p 'rspec-runtime-*' -D tmp/rspec-runtime
      #   cat tmp/rspec-runtime/*/parallel_runtime_rspec.log | sort > spec/parallel_runtime_rspec.log
      - name: Upload test runtimes
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: rspec-runtime-${{ matrix.ci_node_index }}
          path: tmp/parallel_runtime_rspec.log
          retention-days: 14

