name: Parallel CI
on:
  workflow_call:
    inputs:
      fail-fast:
        description: "Stop all jobs if any job fails"
        required: false
        type: boolean
        default: true

jobs:
  parallel-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        # set N-1 indexes for parallel jobs
        # When you run 2 parallel jobs then first job will have index 0, the second job will have index 1 etc
        ci_node_index: [0, 1, 2, 3, 4, 5, 6, 7]
        # Set N number of parallel jobs you want to run
        # Remember to update ci_node_index above to 0..N-1
        # Groups are balanced by recorded runtime (spec/parallel_runtime_rspec.log).
        # The slowest single spec file sets a floor on group time, so more jobs
        # than this mostly adds setup cost without finishing sooner.
        ci_node_total: [8]

    env:
      # Service images, started by the "Start services" step
      MEMCACHED_IMAGE: memcached:1.6.22
      MYSQL_IMAGE: mysql:8.4.7
      OPENSEARCH_IMAGE: opensearchproject/opensearch:2
      # Lightweight LocalStack-compatible AWS emulator for S3 metadata storage.
      # Signatures aren't validated, so the dummy S3 credentials below work as-is.
      FLOCI_IMAGE: floci/floci:2.3.0
      # Fixed ports: each job has the runner to itself.
      MYSQL_HOST: "127.0.0.1"
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_DATABASE: datacite
      ES_HOST: localhost:9200
      ELASTIC_PASSWORD: AnUnsecurePassword123
      MEMCACHE_SERVERS: localhost:11211
    steps:
      # Started here instead of under `services:`, which pulls images one at a
      # time before any step runs. These pull in parallel in the background
      # while the steps below run; "Wait for services" blocks until they're ready.
      - name: Start services
        run: |
          # Background processes keep running after the step ends
          start() {
            name=$1; shift
            echo "Starting $name (${@: -1})"
            (docker run -d --name "$name" "$@" > /dev/null 2> "/tmp/$name.err" || touch "/tmp/$name.failed") &
          }
          start memcached -p 11211:11211 "$MEMCACHED_IMAGE"
          start mysql -p 3306:3306 -e MYSQL_DATABASE=$MYSQL_DATABASE -e MYSQL_ALLOW_EMPTY_PASSWORD=yes "$MYSQL_IMAGE"
          start opensearch -p 9200:9200 \
            -e discovery.type=single-node \
            -e "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m" \
            -e OPENSEARCH_INITIAL_ADMIN_PASSWORD=$ELASTIC_PASSWORD \
            -e DISABLE_SECURITY_PLUGIN=true \
            -e http.cors.enabled=true \
            -e bootstrap.memory_lock=true \
            -e "http.cors.allow-origin=*" \
            -e compatibility.override_main_response_version=true \
            -e logger.org.opensearch.discovery=ERROR \
            "$OPENSEARCH_IMAGE"
          start floci -p 4566:4566 "$FLOCI_IMAGE"

      - uses: actions/checkout@v7

      - name: Sync time
        run: |
          sudo apt-get update
          sudo apt-get install -y ntpdate
          sudo ntpdate pool.ntp.org

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.1
      - uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Install
        env:
          RAILS_ENV: test
        run: |
          cp .env.build .env
          gem install rubygems-update -v 3.4.22
          gem install bundler:2.6.9
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3
      # Nothing above needs the services, so their pulls overlap with all of it
      - name: Wait for services
        timeout-minutes: 3
        run: |
          ready() {
            for name in memcached mysql opensearch floci; do
              if [ -f /tmp/$name.failed ]; then echo "$name failed to start:"; cat /tmp/$name.err; exit 1; fi
            done
            "$@" > /dev/null 2>&1
          }
          until ready docker exec mysql mysqladmin ping -h 127.0.0.1 --silent; do sleep 1; done
          until ready curl -sf "http://$ES_HOST/_cluster/health?wait_for_status=yellow&timeout=1s"; do sleep 1; done
          until ready bash -c "echo > /dev/tcp/127.0.0.1/11211"; do sleep 1; done
          until ready curl -sf http://localhost:4566/_floci/health; do sleep 1; done
          docker ps --format '{{.Names}} ({{.Image}}): {{.Status}}'
      - name: Set up database
        env:
          RAILS_ENV: test
        run: bundle exec rails db:setup
      - name: Test
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ENDPOINT_URL_S3: http://localhost:4566
          AWS_ACCESS_KEY_ID_S3: s3accesskeyid
          AWS_SECRET_ACCESS_KEY_S3: s3accesskeypass
          METADATA_STORAGE_BUCKET_NAME: metadata
          CI_NODE_TOTAL: ${{ matrix.ci_node_total }}
          CI_NODE_INDEX: ${{ matrix.ci_node_index }}
          RAILS_ENV: test
        run: |
          # Record this group's per-file runtimes so the committed log can be refreshed
          RSPEC_OPTS="--format progress --format ParallelTests::RSpec::RuntimeLogger --out tmp/parallel_runtime_rspec.log"
          if [ "${{ inputs.fail-fast }}" = "true" ]; then
            RSPEC_OPTS="$RSPEC_OPTS --fail-fast"
          fi
          bundle exec parallel_test spec/ -n $CI_NODE_TOTAL --only-group $CI_NODE_INDEX --type rspec \
            --group-by runtime --runtime-log spec/parallel_runtime_rspec.log -o "$RSPEC_OPTS"
          echo $?
      # To refresh spec/parallel_runtime_rspec.log from a green run:
      #   gh run download <run-id> -p 'rspec-runtime-*' -D tmp/rspec-runtime
      #   cat tmp/rspec-runtime/*/parallel_runtime_rspec.log | sort > spec/parallel_runtime_rspec.log
      - name: Upload test runtimes
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: rspec-runtime-${{ matrix.ci_node_index }}
          path: tmp/parallel_runtime_rspec.log
          retention-days: 14

