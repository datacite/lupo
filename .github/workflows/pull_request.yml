name: Test Pull Request
on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      fail-fast:
        description: 'Stop all jobs if any job fails'
        type: boolean
        default: true
        required: false
# A new push to the PR cancels the run still going on the previous commit
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    uses: ./.github/workflows/rubocop.yml
    with:
      run_gem_audit: true
  # Runs alongside lint rather than after it, so a lint failure doesn't hold up test results
  parallel-test:
    uses: ./.github/workflows/parallel_ci.yml
    secrets: inherit
    with:
      fail-fast: ${{ github.event_name == 'workflow_dispatch' && inputs.fail-fast || !contains(github.event.pull_request.labels.*.name, 'run-all-tests') }}
